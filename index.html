    <style>
      .app-loader {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        width: 100vw;
        background-color: #ffffff;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }
      .loader-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .loader-logo {
        height: 48px;
        width: auto;
      }
      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #f3f3f3;
        border-top: 3px solid #000000;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .loader-text {
        font-size: 14px;
        color: #666666;
        margin: 0;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
